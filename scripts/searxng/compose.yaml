# A local SearXNG for the harness's web_search tool. Start it with ./up.sh,
# then set SEARXNG_URL=http://127.0.0.1:8888 in the repo's .env.
# Bound to 127.0.0.1 only: nothing outside this machine can use it.
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./up.sh, which generates it}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
